name: Build AI repo map

on:
  push:
    branches: [main]
    paths-ignore:
      - ".ai/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-repo-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate compact AI map
        shell: bash
        run: |
          mkdir -p .ai
          npx --yes repomix@1.18.0 . \
            --style markdown \
            --compress \
            --output .ai/repo-map.md \
            --include "**/*.{py,js,mjs,cjs,ts,tsx,jsx,java,kt,kts,gd,groovy,gradle,toml,json,yaml,yml,sql,sh},README.md,AGENTS.md,PROJECT_*.md" \
            --ignore ".ai/**,**/node_modules/**,**/.gradle/**,**/build/**,**/dist/**,**/.venv/**,**/__pycache__/**,**/.pytest_cache/**,**/.git/**,**/coverage/**,**/*.lock,**/*.min.js,**/*.map,assets/**,art/**,art_sources/**,marketing/**,colab/**,kaggle/**,discovery-cache.json,health-snapshot.json,history.json"

      - name: Validate map size
        shell: bash
        run: |
          test -s .ai/repo-map.md
          bytes="$(wc -c < .ai/repo-map.md)"
          echo "repo-map bytes: $bytes"
          if [ "$bytes" -gt 1500000 ]; then
            echo "AI map is too large (>1.5 MB); refusing to commit it." >&2
            exit 1
          fi

      - name: Commit updated map
        shell: bash
        run: |
          if git diff --quiet -- .ai/repo-map.md && git ls-files --error-unmatch .ai/repo-map.md >/dev/null 2>&1; then
            echo "AI map unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/repo-map.md
          git commit -m "chore(ai): refresh compact repo map"
          git push
